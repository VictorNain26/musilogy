name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      # The slow suite (pytest -m slow) replays the pipeline against the real
      # MusicBrainz dump: it needs the ~600 MB extractions under
      # data/work/, which are not versioned and take ~10 min to produce, so it
      # is not run here. The default addopts ("-m 'not slow'") skips it.
      - name: Test
        run: uv run pytest

  web:
    name: web lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before setup-node, which needs pnpm on PATH to resolve its store for
      # the cache. package_json_file points at web/, whose packageManager
      # field is the single place the pnpm version is written.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm run check

      - name: Types
        run: pnpm run types

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
